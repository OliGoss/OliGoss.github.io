project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "papers/*.qmd"
    - "teaching-material/*.qmd"
    - "ttw/*.qmd"
    - "press/*.qmd"
    - "sinfonia/*.qmd"
    - "cv/*.qmd"
  resources:
    - assets/
    - wp-content/uploads/
    - cv.pdf
    - .nojekyll
    - "!_site/**"
    - "!.quarto/**"
  post-render:
    - python3 scripts/preserve-links.py

website:
  title: Olivier Gossner
  description: "Game theory and the economics of information. Research, publications and teaching by Olivier Gossner."
  favicon: assets/favicon.svg
  search: false
  navbar:
    title: Olivier Gossner
    background: light
    collapse-below: lg
    left:
      - text: Research
        href: papers/index.qmd
      - text: SInfoNiA
        href: sinfonia/index.qmd
      - text: Teaching
        href: teaching-material/index.qmd
      - text: Workshops
        href: ttw/index.qmd
      - text: Media
        href: press/index.qmd
    right:
      - text: CV
        href: cv/index.qmd
      - text: Contact
        href: index.qmd#contact
  page-footer:
    border: false
    left: "Olivier Gossner"
    right:
      - text: Email
        href: mailto:ogossner@gmail.com
      - text: ORCID
        href: https://orcid.org/0000-0003-3950-0208

format:
  html:
    theme:
      - cosmo
      - assets/theme.scss
    toc: false
    anchor-sections: false
    link-external-newwindow: false
    smooth-scroll: true
    respect-user-color-scheme: false
    include-after-body: _includes/site.js.html
    lang: en
    date-format: YYYY

editor: visual
