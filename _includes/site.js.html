<script>
// Keep historical WordPress numeric links useful on a static host.
(function () {
  const query = new URLSearchParams(window.location.search);
  if (!query.has('p') && !query.has('page_id')) return;
  const id = query.get('p') || query.get('page_id');
  fetch('/assets/legacy-ids.json').then(r => r.ok ? r.json() : {}).then(routes => {
    if (routes[id]) window.location.replace(routes[id] + window.location.hash);
  }).catch(() => {});
})();
</script>

<script>
// Record clicks on downloadable files as GoatCounter events. The event name
// retains the file path, while the referrer identifies the page containing it.
(function () {
  const downloadable = /\.(?:csv|docx?|epub|pdf|pptx?|tex|xlsx?|zip)$/i;

  document.querySelectorAll('a[href]').forEach((link) => {
    try {
      const target = new URL(link.href, document.baseURI);
      const arxivPdf = /(^|\.)arxiv\.org$/i.test(target.hostname) &&
        /^\/pdf\//i.test(target.pathname);
      if (!downloadable.test(target.pathname) && !arxivPdf) return;

      const filename = target.pathname.split('/').pop() || target.pathname;
      const destination = target.hostname === window.location.hostname
        ? target.pathname
        : `${target.hostname}${target.pathname}`;
      link.dataset.goatcounterClick = `download:${destination}`;
      link.dataset.goatcounterTitle = `Download: ${filename} (${target.hostname})`;
      link.dataset.goatcounterReferrer = window.location.pathname;
      link.dataset.goatcounterNoSession = '1';
    } catch (_) {
      // Ignore malformed links rather than interfering with navigation.
    }
  });
})();
</script>
<script data-goatcounter="https://gossnero.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
