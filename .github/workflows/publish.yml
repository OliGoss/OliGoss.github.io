name: Build and publish website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - name: Build the review or production version
        env:
          SITE_PROFILE: ${{ vars.SITE_PROFILE || 'preview' }}
        run: |
          if [ "$SITE_PROFILE" != "preview" ] && [ "$SITE_PROFILE" != "production" ]; then
            echo 'SITE_PROFILE must be preview or production.'
            exit 1
          fi
          quarto render --profile "$SITE_PROFILE"
          python3 scripts/check-site.py
      - name: Package website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check root-domain hosting
        id: pages
        uses: actions/configure-pages@v5
      - name: Verify this is a root website
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$PAGES_BASE_PATH" ] && [ "$PAGES_BASE_PATH" != "/" ]; then
            echo 'Use a USERNAME.github.io repository or configure gossner.me before deploying. The preserved legacy URLs require a root website.'
            exit 1
          fi
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
